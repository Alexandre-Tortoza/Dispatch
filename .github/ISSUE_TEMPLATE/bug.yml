name: Reportar bug
description: Registre um comportamento incorreto ou inesperado.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        O título da issue deve ser escrito em inglês. As informações descritivas abaixo devem ser preenchidas em PT-BR.

  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Explique onde o problema ocorre e por que ele é relevante.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      description: Informe uma sequência mínima e determinística para reproduzir o problema.
      placeholder: |
        1. Execute ...
        2. Envie ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
      description: Descreva o resultado correto esperado.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamento atual
      description: Descreva o que acontece atualmente.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: Adicione logs, mensagens de erro ou outras evidências relevantes. Remova dados sensíveis.
      render: shell

  - type: input
    id: environment
    attributes:
      label: Ambiente
      description: Informe ambiente, versão ou contexto de execução quando aplicável.
      placeholder: staging, PHP 8.x, PostgreSQL...

  - type: textarea
    id: validation
    attributes:
      label: Validação esperada
      description: Explique como a correção poderá ser confirmada.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependências
      description: Liste issues, decisões ou entregas relacionadas. Use "Nenhuma" quando não houver.
    validations:
      required: true

  - type: textarea
    id: documentation
    attributes:
      label: Impacto em documentação
      description: Indique a documentação que deve ser atualizada. Use "Nenhum" quando não houver.
    validations:
      required: true
