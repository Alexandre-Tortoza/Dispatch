name: Criar tarefa
description: Registre trabalho técnico, operacional ou de manutenção com escopo verificável.
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        O título da issue deve ser escrito em inglês. As informações descritivas abaixo devem ser preenchidas em PT-BR.

  - type: textarea
    id: context
    attributes:
      label: Contexto
      description: Explique por que a tarefa é necessária.
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objetivo
      description: Defina o resultado esperado.
    validations:
      required: true

  - type: textarea
    id: requirements
    attributes:
      label: Requisitos
      description: Liste restrições e requisitos técnicos relevantes.
    validations:
      required: true

  - type: textarea
    id: deliverables
    attributes:
      label: Entregáveis
      description: Liste artefatos ou mudanças que devem existir ao final.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      description: Liste condições objetivas para conclusão.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validação
      description: Explique como a entrega será verificada.
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependências
      description: Liste issues, decisões ou entregas relacionadas. Use "Nenhuma" quando não houver.
    validations:
      required: true

  - type: textarea
    id: documentation
    attributes:
      label: Impacto em documentação
      description: Indique a documentação afetada. Use "Nenhum" quando não houver.
    validations:
      required: true
