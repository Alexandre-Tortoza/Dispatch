name: Bootstrap labels

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-labels.yml

permissions:
  issues: write
  statuses: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const desired = [{"name":"tipo: funcionalidade","color":"1D76DB","description":"Nova funcionalidade ou capacidade do sistema"},{"name":"tipo: bug","color":"D73A4A","description":"Comportamento incorreto ou defeito no sistema"},{"name":"tipo: refatoração","color":"5319E7","description":"Melhoria interna sem alteração intencional de comportamento"},{"name":"tipo: tarefa","color":"0E8A16","description":"Trabalho técnico, operacional ou de manutenção"},{"name":"tipo: documentação","color":"0075CA","description":"Criação ou atualização de documentação"},{"name":"tipo: teste","color":"FBCA04","description":"Criação, correção ou melhoria de testes"},{"name":"tipo: segurança","color":"B60205","description":"Mudança relacionada à segurança da aplicação ou infraestrutura"},{"name":"prioridade: crítica","color":"B60205","description":"Prioridade crítica, requer tratamento imediato"},{"name":"prioridade: alta","color":"D93F0B","description":"Alta prioridade dentro da milestone"},{"name":"prioridade: média","color":"FBCA04","description":"Prioridade normal dentro da milestone"},{"name":"prioridade: baixa","color":"0E8A16","description":"Baixa prioridade dentro da milestone"},{"name":"status: bloqueada","color":"B60205","description":"O trabalho está impedido por uma dependência ou condição externa"},{"name":"status: precisa-decisão","color":"D876E3","description":"Requer decisão técnica ou de produto antes de avançar"},{"name":"status: precisa-revisão","color":"1D76DB","description":"Requer revisão antes de avançar"},{"name":"status: duplicada","color":"CFD3D7","description":"A issue ou pull request duplica outro trabalho existente"},{"name":"status: inválida","color":"E4E669","description":"A issue não representa um trabalho válido ou aplicável"},{"name":"status: não-planejada","color":"6A737D","description":"O trabalho não está planejado para execução"},{"name":"área: dx","color":"0E8A16","description":"Developer Experience e fluxo local de desenvolvimento"},{"name":"área: ci-cd","color":"0E8A16","description":"Integração contínua, entrega e deployment"},{"name":"área: infraestrutura","color":"0E8A16","description":"Infraestrutura, containers e ambientes"},{"name":"área: arquitetura","color":"0E8A16","description":"Arquitetura e organização estrutural da aplicação"},{"name":"área: api","color":"0E8A16","description":"API HTTP, contratos e convenções de integração"},{"name":"área: autenticação","color":"0E8A16","description":"Autenticação, autorização e controle de acesso"},{"name":"área: domínio","color":"0E8A16","description":"Regras e modelos centrais de domínio"},{"name":"área: banco-de-dados","color":"0E8A16","description":"Persistência, consultas, migrations e banco de dados"},{"name":"área: estoque","color":"0E8A16","description":"Inventário, reservas e movimentações de estoque"},{"name":"área: entregas","color":"0E8A16","description":"Remessas, transportadoras, tracking e entregas"},{"name":"área: filas","color":"0E8A16","description":"Filas, jobs e processamento assíncrono"},{"name":"área: observabilidade","color":"0E8A16","description":"Logs, métricas, tracing e monitoramento"},{"name":"área: segurança","color":"0E8A16","description":"Controles e hardening de segurança"},{"name":"área: documentação","color":"0E8A16","description":"Documentação técnica, operacional e runbooks"},{"name":"dependências","color":"5319E7","description":"Trabalho relacionado a dependências internas ou externas"},{"name":"breaking-change","color":"B60205","description":"Mudança incompatível que exige atenção de versionamento ou migração"}];
            const renameMap = {"bug":"tipo: bug","documentation":"tipo: documentação","duplicate":"status: duplicada","enhancement":"tipo: funcionalidade","invalid":"status: inválida","question":"status: precisa-decisão","wontfix":"status: não-planejada"};
            const remove = ["accessibility","good first issue","help wanted"];
            const { owner, repo } = context.repo;

            async function listLabels() {
              return await github.paginate(github.rest.issues.listLabelsForRepo, {
                owner, repo, per_page: 100
              });
            }

            let existing = await listLabels();
            let byName = new Map(existing.map(label => [label.name, label]));

            for (const [oldName, newName] of Object.entries(renameMap)) {
              if (!byName.has(oldName)) continue;
              const desiredLabel = desired.find(label => label.name === newName);
              if (byName.has(newName)) {
                await github.rest.issues.deleteLabel({ owner, repo, name: oldName });
              } else {
                await github.rest.issues.updateLabel({
                  owner, repo, name: oldName,
                  new_name: newName,
                  color: desiredLabel.color,
                  description: desiredLabel.description
                });
              }
              existing = await listLabels();
              byName = new Map(existing.map(label => [label.name, label]));
            }

            for (const name of remove) {
              if (byName.has(name)) {
                await github.rest.issues.deleteLabel({ owner, repo, name });
                existing = await listLabels();
                byName = new Map(existing.map(label => [label.name, label]));
              }
            }

            for (const label of desired) {
              const current = byName.get(label.name);
              if (!current) {
                await github.rest.issues.createLabel({
                  owner, repo,
                  name: label.name,
                  color: label.color,
                  description: label.description
                });
              } else if (
                current.color.toUpperCase() !== label.color.toUpperCase() ||
                (current.description || "") !== label.description
              ) {
                await github.rest.issues.updateLabel({
                  owner, repo,
                  name: label.name,
                  new_name: label.name,
                  color: label.color,
                  description: label.description
                });
              }
              existing = await listLabels();
              byName = new Map(existing.map(label => [label.name, label]));
            }

            const finalLabels = await listLabels();
            const finalByName = new Map(finalLabels.map(label => [label.name, label]));
            const errors = [];

            for (const label of desired) {
              const current = finalByName.get(label.name);
              if (!current) {
                errors.push(`ausente: ${label.name}`);
                continue;
              }
              if (current.color.toUpperCase() !== label.color.toUpperCase()) {
                errors.push(`cor divergente: ${label.name}`);
              }
              if ((current.description || "") !== label.description) {
                errors.push(`descrição divergente: ${label.name}`);
              }
            }

            for (const oldName of [...Object.keys(renameMap), ...remove]) {
              if (finalByName.has(oldName)) errors.push(`label antiga ainda presente: ${oldName}`);
            }

            if (errors.length) {
              core.setFailed(errors.join("\n"));
              return;
            }

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: context.sha,
              state: "success",
              context: "bootstrap/labels",
              description: "33 labels configured and verified"
            });

            core.info("33 labels configured and verified.");
