name: Bootstrap milestones

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-milestones.yml

permissions:
  issues: write
  statuses: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const milestones = [["M00 - Repository Governance","2026-10-04","Estabelecer as regras fundamentais de governança do repositório, colaboração, revisão e integração de código. O objetivo é manter a branch principal protegida, previsível e sempre em condição de deploy."],["M01 - Developer Experience","2026-10-08","Padronizar a experiência de desenvolvimento local para que o projeto possa ser instalado, executado, testado e mantido de forma reproduzível por qualquer colaborador."],["M02 - Laravel Application Bootstrap","2026-10-12","Inicializar a aplicação Laravel e estabelecer as decisões técnicas fundamentais do projeto, incluindo configuração base, estrutura inicial e convenções que orientarão a evolução do código."],["M03 - Local Development Infrastructure","2026-10-17","Disponibilizar uma infraestrutura local completa e reproduzível para executar a aplicação e suas dependências com comportamento próximo ao ambiente de produção."],["M04 - Code Quality Gate","2026-10-21","Estabelecer uma barreira automatizada de qualidade para impedir que código fora dos padrões definidos, com falhas de testes ou problemas de análise estática avance no fluxo de desenvolvimento."],["M05 - Continuous Integration","2026-10-26","Implementar a integração contínua do projeto, garantindo que cada alteração seja automaticamente validada antes de ser incorporada à branch principal."],["M06 - Automated PR Audit","2026-10-31","Adicionar uma camada automatizada de auditoria de Pull Requests para identificar riscos, inconsistências e possíveis regressões que complementem as verificações determinísticas da CI."],["M07 - Container & Artifact Pipeline","2026-11-04","Estabelecer a geração de artefatos de aplicação versionados e imutáveis, permitindo que o mesmo artefato validado seja promovido entre os diferentes ambientes."],["M08 - Deployment Infrastructure","2026-11-08","Preparar a infraestrutura necessária para executar o sistema fora do ambiente local, incluindo os serviços, dependências e mecanismos necessários para realizar deployments de forma controlada."],["M09 - Staging Environment","2026-11-12","Criar um ambiente de staging isolado e representativo da produção para validar automaticamente novas versões antes de sua promoção ao ambiente produtivo."],["M10 - Observability Baseline","2026-11-16","Estabelecer a base de observabilidade da aplicação, permitindo identificar versões implantadas, acompanhar falhas e obter sinais essenciais sobre o comportamento do sistema."],["M11 - Feature Flags & Safe Delivery","2026-11-20","Introduzir mecanismos que permitam separar deployment de release e controlar a ativação de funcionalidades sem exigir uma nova implantação da aplicação."],["M12 - Continuous Deployment","2026-11-25","Automatizar o fluxo de deployment a partir da branch principal, promovendo versões validadas entre os ambientes e interrompendo o processo quando verificações de segurança falharem."],["M13 - Release Management","2026-11-30","Definir um processo consistente de versionamento e publicação de releases, mantendo rastreabilidade entre código, artefatos, versões implantadas e mudanças entregues."],["M14 - Application Architecture","2026-12-07","Definir e materializar a arquitetura modular da aplicação, estabelecendo limites claros entre responsabilidades e regras de dependência que sustentem a evolução do sistema."],["M15 - API Foundation","2026-12-14","Estabelecer a base da API HTTP do projeto, com convenções consistentes de versionamento, validação, respostas, erros e documentação para os recursos futuros."],["M16 - Authentication & Authorization","2026-12-21","Implementar os mecanismos de autenticação e autorização necessários para controlar o acesso à API e garantir que cada usuário possa executar apenas operações permitidas."],["M17 - Products & Customers","2026-12-30","Introduzir os conceitos fundamentais de produtos e clientes, estabelecendo os dados e comportamentos básicos que servirão de base para o fluxo de pedidos."],["M18 - Order Management","2027-01-04","Implementar o ciclo de vida dos pedidos, permitindo sua criação, evolução de estado, cancelamento e aplicação consistente das regras de negócio associadas."],["M19 - Warehouse Management","2027-01-08","Representar e gerenciar os centros de distribuição utilizados pela plataforma, incluindo suas características operacionais e disponibilidade para participação no fulfillment."],["M20 - Inventory Management","2027-01-13","Implementar o controle de estoque por armazém, mantendo quantidades disponíveis, reservadas e o histórico das movimentações que alteram o saldo dos produtos."],["M21 - Inventory Reservation & Concurrency","2027-01-18","Implementar os mecanismos necessários para garantir reservas de estoque consistentes em cenários concorrentes, evitando condições de corrida, estoque negativo e inconsistências durante operações simultâneas."],["M22 - Warehouse Allocation","2027-01-22","Implementar a lógica responsável por selecionar o armazém adequado para atender um pedido, considerando disponibilidade e estratégias de alocação extensíveis."],["M23 - Shipment Management","2027-01-27","Implementar o gerenciamento de remessas associadas aos pedidos e armazéns, incluindo seu ciclo de vida e as regras que governam a evolução do processo de envio."],["M24 - Carrier Abstraction","2027-01-31","Criar uma abstração uniforme para integração com transportadoras, isolando diferenças entre provedores e permitindo substituir ou adicionar integrações sem acoplar o domínio."],["M25 - Queue Infrastructure","2027-02-04","Estabelecer a infraestrutura de processamento assíncrono da aplicação, permitindo distribuir trabalhos em filas com prioridades, isolamento e mecanismos operacionais adequados."],["M26 - Async Fulfillment Pipeline","2027-02-08","Implementar o fluxo assíncrono de fulfillment, conectando confirmação de pedidos, reserva de estoque, criação de remessas e integração com transportadoras por meio de eventos e jobs."],["M27 - Retry & Failure Policies","2027-02-13","Definir políticas consistentes para tratamento de falhas em processos assíncronos e integrações externas, diferenciando erros recuperáveis de falhas permanentes."],["M28 - Carrier Webhooks","2027-02-18","Implementar a recepção segura e assíncrona de eventos enviados pelas transportadoras, preservando os dados recebidos e encaminhando-os para processamento interno."],["M29 - Idempotency & Inbox Pattern","2027-02-23","Garantir o processamento idempotente de eventos externos, evitando efeitos duplicados e mantendo rastreabilidade sobre mensagens recebidas e processadas."],["M30 - Transactional Outbox","2027-02-28","Implementar uma estratégia de Transactional Outbox para garantir consistência entre alterações persistidas no banco de dados e eventos ou mensagens publicados de forma assíncrona."],["M31 - Shipment Tracking","2027-03-07","Implementar o acompanhamento da evolução das remessas por meio de eventos de tracking, preservando o histórico e oferecendo uma visão consistente do estado do envio."],["M32 - Delivery Management","2027-03-14","Implementar o controle das tentativas de entrega e a conclusão das remessas, registrando resultados e aplicando as regras necessárias para sucessos e falhas."],["M33 - SLA & Scheduled Processes","2027-03-21","Implementar processos baseados em tempo para acompanhar prazos operacionais, identificar atrasos e executar rotinas recorrentes de forma segura e observável."],["M34 - Audit Trail","2027-03-31","Criar uma trilha de auditoria para operações relevantes do sistema, permitindo identificar quem realizou alterações, o que mudou e em qual contexto elas ocorreram."],["M35 - Structured Logging & Correlation","2027-04-06","Padronizar os logs da aplicação e propagar identificadores de correlação entre requisições, jobs e integrações para permitir rastrear uma operação ponta a ponta."],["M36 - Metrics & Monitoring","2027-04-12","Instrumentar métricas técnicas e de negócio que permitam acompanhar saúde, desempenho e comportamento operacional do sistema por meio de monitoramento contínuo."],["M37 - Distributed Tracing","2027-04-18","Adicionar tracing distribuído aos principais fluxos da aplicação para visualizar a passagem de operações entre HTTP, banco de dados, filas e integrações externas."],["M38 - Health & Readiness Checks","2027-04-24","Disponibilizar verificações de saúde e prontidão que permitam distinguir se a aplicação está viva, apta a receber tráfego e capaz de acessar suas dependências essenciais."],["M39 - Failure Recovery & Dead Letter Queue","2027-04-30","Estabelecer mecanismos e procedimentos para inspecionar, recuperar, reprocessar ou descartar trabalhos que falharam após esgotar as políticas automáticas de retry."],["M40 - Database Performance","2027-05-08","Analisar e otimizar o desempenho das consultas e estruturas de banco de dados críticas, utilizando evidências mensuráveis para orientar índices e demais melhorias."],["M41 - Application Performance & Cache","2027-05-15","Otimizar o desempenho da aplicação e introduzir cache apenas onde houver benefício mensurável, com estratégias claras de expiração, invalidação e comportamento em falhas."],["M42 - Security Hardening","2027-05-23","Realizar o endurecimento de segurança da aplicação e de suas integrações, revisando superfícies de ataque, controles de acesso, dados sensíveis e dependências."],["M43 - Load & Resilience Testing","2027-05-31","Validar o comportamento do sistema sob carga, concorrência e falhas de dependências, verificando sua capacidade de degradação controlada e recuperação."],["M44 - Safe Database Migrations","2027-06-06","Estabelecer práticas de migração de banco compatíveis com deployments contínuos, minimizando indisponibilidade e evitando mudanças de schema incompatíveis entre versões."],["M45 - Rollback & Deployment Recovery","2027-06-12","Definir e validar mecanismos de recuperação para deployments malsucedidos, permitindo restaurar rapidamente uma versão operacional sem comprometer a integridade dos dados."],["M46 - Backup & Disaster Recovery","2027-06-18","Implementar uma estratégia de backup e recuperação de desastre com procedimentos verificáveis, objetivos operacionais claros e testes reais de restauração."],["M47 - Production Hardening","2027-06-24","Revisar e ajustar a configuração de produção da aplicação e de sua infraestrutura para garantir segurança, estabilidade, desempenho e operação previsível."],["M48 - Documentation & Runbooks","2027-06-30","Consolidar a documentação técnica e operacional do sistema, registrando arquitetura, decisões, integrações, procedimentos e respostas a cenários de falha."],["M49 - Portfolio Release v1.0","2027-07-31","Preparar e publicar a versão 1.0 do projeto como uma demonstração completa de engenharia backend, reunindo arquitetura, operação, documentação e evidências das capacidades implementadas."]];
            const { owner, repo } = context.repo;
            const existing = await github.paginate(github.rest.issues.listMilestones, {
              owner, repo, state: 'all', per_page: 100
            });
            const byTitle = new Map(existing.map(m => [m.title, m]));
            for (const [title, dueDate, description] of milestones) {
              const current = byTitle.get(title);
              if (current) {
                const currentDue = (current.due_on || '').slice(0, 10);
                if (currentDue !== dueDate || (current.description || '') !== description) {
                  core.setFailed(`Milestone conflitante: ${title}`);
                  return;
                }
                continue;
              }
              await github.rest.issues.createMilestone({
                owner,
                repo,
                title,
                state: 'open',
                description,
                due_on: dueDate + 'T23:59:59Z'
              });
            }
            const finalMilestones = await github.paginate(github.rest.issues.listMilestones, {
              owner, repo, state: 'all', per_page: 100
            });
            const finalByTitle = new Map(finalMilestones.map(m => [m.title, m]));
            for (const [title, dueDate, description] of milestones) {
              const item = finalByTitle.get(title);
              if (!item) {
                core.setFailed(`Milestone ausente após criação: ${title}`);
                return;
              }
              if ((item.due_on || '').slice(0, 10) !== dueDate || (item.description || '') !== description) {
                core.setFailed(`Milestone inválida após criação: ${title}`);
                return;
              }
            }
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: context.sha,
              state: 'success',
              context: 'bootstrap/milestones',
              description: '50 milestones created and verified'
            });
            core.info('50 milestones created and verified.');
