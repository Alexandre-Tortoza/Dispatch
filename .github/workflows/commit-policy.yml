name: Governance / Commit Policy

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-policy:
    name: governance / commit-policy
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Validate pull request commits
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.request

          repository = os.environ["REPOSITORY"]
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ["GH_TOKEN"]

          header_re = re.compile(
              r"^(feat|fix|refactor|perf|test|docs|build|ci|chore|revert)"
              r"(\([a-z0-9]+(?:-[a-z0-9]+)*\))?"
              r"(!)?: (.+)$"
          )

          commits = []
          page = 1

          while True:
              url = (
                  f"https://api.github.com/repos/{repository}/pulls/"
                  f"{pr_number}/commits?per_page=100&page={page}"
              )
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )

              with urllib.request.urlopen(request) as response:
                  batch = json.load(response)

              commits.extend(batch)

              if len(batch) < 100:
                  break

              page += 1

          errors = []

          for item in commits:
              sha = item["sha"][:12]
              message = item["commit"]["message"]
              header = message.splitlines()[0]

              if header.startswith("Merge "):
                  continue

              if len(header) > 100:
                  errors.append(f"{sha}: header exceeds 100 characters")
                  continue

              match = header_re.fullmatch(header)

              if not match:
                  errors.append(
                      f"{sha}: invalid Conventional Commit header: {header!r}"
                  )
                  continue

              description = match.group(4)

              if description.endswith("."):
                  errors.append(f"{sha}: description must not end with a period")

              if match.group(3) and "BREAKING CHANGE:" not in message:
                  errors.append(
                      f"{sha}: breaking commit requires a BREAKING CHANGE footer"
                  )

          if errors:
              print("Commit policy violations:", file=sys.stderr)
              for error in errors:
                  print(f"- {error}", file=sys.stderr)
              sys.exit(1)

          print(f"Validated {len(commits)} commit(s).")
          PY
