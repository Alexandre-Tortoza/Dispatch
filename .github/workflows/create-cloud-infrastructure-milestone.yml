name: Create cloud infrastructure milestone

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-cloud-infrastructure-milestone.yml

permissions:
  contents: read
  issues: write

jobs:
  create-milestone:
    runs-on: ubuntu-latest

    steps:
      - name: Discover and create next roadmap milestone
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repository = os.environ["GH_REPOSITORY"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "dispatch-milestone-bootstrap",
          }

          milestones = []
          page = 1
          while True:
              request = urllib.request.Request(
                  f"{api}/milestones?state=all&per_page=100&page={page}",
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  batch = json.load(response)
              milestones.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          pattern = re.compile(r"^M(\d{2})\b")
          numbered = []
          for milestone in milestones:
              match = pattern.match(milestone.get("title", ""))
              if match:
                  numbered.append((int(match.group(1)), milestone))

          current = max((number for number, _ in numbered), default=-1)
          next_number = current + 1
          title = f"M{next_number:02d} - Cloud Infrastructure & Infrastructure as Code"

          existing = next((m for _, m in numbered if m.get("title") == title), None)
          if existing:
              print(f"Milestone already exists: {existing['number']} {title}")
              raise SystemExit(0)

          description = (
              "Provisionar e versionar a infraestrutura cloud do Dispatch com Terraform e OCI, "
              "estabelecendo uma base reproduzível, segura e validada por CI para os ambientes "
              "posteriores de staging e produção."
          )

          payload = json.dumps({
              "title": title,
              "description": description,
              "state": "open",
          }).encode()

          request = urllib.request.Request(
              f"{api}/milestones",
              data=payload,
              headers={**headers, "Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request) as response:
                  created = json.load(response)
          except urllib.error.HTTPError as error:
              print(error.read().decode())
              raise

          print(f"Created milestone #{created['number']}: {created['title']}")
          print(created["html_url"])
          PY
