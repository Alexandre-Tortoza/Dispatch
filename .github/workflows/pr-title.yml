name: Governance / Pull Request Title

on:
  pull_request:
    branches:
      - dev
      - staging
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: governance / pr-title
    runs-on: ubuntu-latest
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - name: Validate pull request title
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import os
          import re
          import sys

          title = os.environ["PR_TITLE"]

          title_re = re.compile(
              r"^(feat|fix|refactor|perf|test|docs|build|ci|chore|revert)"
              r"(\([a-z0-9]+(?:-[a-z0-9]+)*\))?"
              r"(!)?: (.+)$"
          )

          if len(title) > 100:
              print("PR title must contain at most 100 characters.", file=sys.stderr)
              sys.exit(1)

          match = title_re.fullmatch(title)

          if not match:
              print(
                  "PR title must follow Conventional Commits, for example "
                  "'feat(order): add order creation'.",
                  file=sys.stderr,
              )
              sys.exit(1)

          description = match.group(4)

          if description.endswith("."):
              print("PR title description must not end with a period.", file=sys.stderr)
              sys.exit(1)

          print("Pull request title is valid.")
          PY
